<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which server answered?</title>
<style>
  :root{--bg:#eef2f3;--ink:#0f2a2e;--mute:#58706f;--line:#c9d6d6;--a:#0a7f78;--b:#c2570c;--u:#6b7b7a}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1b1d;--ink:#e6f0ef;--mute:#8ea6a5;--line:#243b3e;--a:#3fc4b9;--b:#f29a52;--u:#8ea6a5}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:46rem;margin:0 auto;padding:3rem 1.25rem 4rem}
  h1{font-size:1.1rem;font-weight:600;margin:0 0 .25rem;color:var(--mute)}
  .id{font:600 clamp(1.9rem,7vw,3.2rem)/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em;margin:0;word-break:break-all}
  .az{display:inline-block;margin-top:.9rem;padding:.2rem .7rem;border:2px solid currentColor;border-radius:99px;font-weight:600}
  dl{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1.5rem;margin:2rem 0;padding-top:1.25rem;border-top:1px solid var(--line)}
  dt{color:var(--mute)} dd{margin:0;font-family:ui-monospace,Menlo,monospace}
  h2{font-size:1.05rem;margin:2.5rem 0 .5rem}
  p{max-width:60ch;margin:.25rem 0 1rem;color:var(--mute)}
  button{font:inherit;font-weight:600;color:var(--bg);background:var(--ink);border:0;border-radius:6px;padding:.6rem 1.1rem;cursor:pointer}
  button:focus-visible{outline:3px solid var(--a);outline-offset:2px} button:disabled{opacity:.6;cursor:wait}
  .bars{margin-top:1.25rem;display:grid;gap:.6rem}
  .row{display:grid;grid-template-columns:11.5rem 1fr 2.5rem;align-items:center;gap:.75rem;font:.85rem ui-monospace,Menlo,monospace}
  .track{height:.9rem;background:var(--line);border-radius:3px;overflow:hidden}
  .fill{height:100%;transition:width .25s}
  .err{color:#b3261e}
  @media (max-width:520px){.row{grid-template-columns:1fr 2.5rem}.track{grid-column:1/-1;grid-row:2}}
  @media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main>
  <h1>This response came from</h1>
  <p class="id" id="iid">loading…</p>
  <span class="az" id="az"></span>
  <dl>
    <dt>Private IP</dt><dd id="ip">–</dd>
    <dt>Instance type</dt><dd id="type">–</dd>
    <dt>Requests this server has handled</dt><dd id="count">–</dd>
  </dl>

  <h2>See the load balancer split traffic</h2>
  <p>Sends 30 requests through the load balancer and counts which instance answered each one.</p>
  <button id="go">Send 30 requests</button>
  <div class="bars" id="bars" aria-live="polite"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const azColor = {}; // stable colour per availability zone
const pick = az => azColor[az] ||= (Object.keys(azColor).length % 2 ? "var(--b)" : "var(--a)");

async function info(){
  const r = await fetch("/api/info", {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function paint(d){
  $("iid").textContent = d.instance_id;
  $("az").textContent = d.availability_zone;
  $("az").style.color = pick(d.availability_zone);
  $("ip").textContent = d.private_ip;
  $("type").textContent = d.instance_type;
  $("count").textContent = d.requests_served;
}
info().then(paint).catch(e => { $("iid").textContent = "Could not reach /api/info"; $("iid").className += " err"; });

$("go").onclick = async () => {
  const btn = $("go"), tally = {}, N = 30;
  btn.disabled = true; $("bars").textContent = "";
  for(let i = 0; i < N; i++){
    try{ const d = await info(); const k = d.instance_id + "|" + d.availability_zone; tally[k] = (tally[k]||0) + 1; }
    catch(e){ tally.failed = (tally.failed||0) + 1; }
  }
  Object.entries(tally).forEach(([k,n]) => {
    const [id, az] = k.split("|");
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<span></span><div class="track"><div class="fill"></div></div><span></span>`;
    row.children[0].textContent = az ? `${id} (${az})` : "failed";
    row.children[2].textContent = n;
    const f = row.querySelector(".fill"); f.style.width = (n/N*100) + "%"; f.style.background = az ? pick(az) : "var(--u)";
    $("bars").appendChild(row);
  });
  btn.disabled = false;
};
</script>
</body>
</html>
